  <script>
    (function(){
      try {
        var path = (location.pathname || '').replace(/\/$/, '') || '/';
        if (path !== '/' && path !== '/login') return;

        function cookieGet(name){
          var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()\[\]\\\/\+^])/g,'\\$1') + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : '';
        }
        function cookieSet(name, value, maxAgeSeconds){
          var host = location.hostname;
          var parts = host.split('.');
          var dom = '';
          if (parts.length >= 2 && host !== 'localhost' && !/^\d+\.\d+\.\d+\.\d+$/.test(host)) {
            dom = '; domain=.' + parts.slice(-2).join('.');
          }
          var sec = location.protocol === 'https:' ? '; Secure' : '';
          document.cookie = name + '=' + encodeURIComponent(value) + '; Path=/; Max-Age=' + maxAgeSeconds + '; SameSite=Lax' + sec + dom;
        }

        var now = Date.now();
        var raw = cookieGet('fg_nav_count');
        var arr = raw ? raw.split('.').map(function(x){ return parseInt(x,10); }).filter(function(x){ return !isNaN(x); }) : [];
        var recent = arr.filter(function(t){ return now - t < 10000; });
        recent.push(now);
        if (recent.length > 10) recent = recent.slice(-10);
        cookieSet('fg_nav_count', recent.join('.'), 60);

        if (recent.length >= 5) {
          window._fgLoopBreak = true;
        }
      } catch(_) {}
    })();
  </script>

<script>
(function() {
  var p = new URLSearchParams(window.location.search);
  var root = document.documentElement;

  function safeHex(v) {
    if (!v) return null;
    v = v.trim();
    return /^#[0-9A-Fa-f]{6}$/.test(v) ? v : null;
  }
  function safeInt(v, min, max) {
    var n = parseInt(v, 10);
    return (!isNaN(n) && n >= min && n <= max) ? n : null;
  }
  function safeFontStack(v) {
    if (!v || !/^[-a-zA-Z0-9 ,'"._]+$/.test(v)) return null;
    return v;
  }

  var accent  = safeHex(p.get('accent'));
  var bg      = safeHex(p.get('bg'));
  var surface = safeHex(p.get('surface'));
  var text    = safeHex(p.get('text'));
  var radius  = safeInt(p.get('radius'), 0, 24);
  var btn     = safeInt(p.get('btn'), 0, 999);
  var font    = safeFontStack(p.get('font'));
  var title   = (p.get('title') || '').replace(/[<>&"']/g, '').slice(0, 80);
  var sub     = (p.get('subtitle') || '').replace(/[<>&"']/g, '').slice(0, 120);

  if (accent)  { root.style.setProperty('--th-accent', accent); root.style.setProperty('--y', accent); }
  if (bg)      { root.style.setProperty('--th-bg', bg); document.body.style.background = bg; }
  if (surface) { root.style.setProperty('--th-surface', surface); }
  if (text)    { root.style.setProperty('--th-text', text); }
  if (radius !== null) {
    root.style.setProperty('--th-radius', radius + 'px');
    root.style.setProperty('--th-radius-sm', Math.max(0, radius - 4) + 'px');
  }
  if (btn !== null)    root.style.setProperty('--th-radius-btn', btn + 'px');
  if (font)            root.style.setProperty('--th-font', font);

  var bgHex = bg || '#0A0806';
  var bgR = parseInt(bgHex.slice(1,3),16);
  var bgG = parseInt(bgHex.slice(3,5),16);
  var bgB = parseInt(bgHex.slice(5,7),16);
  var isLight = (bgR*299 + bgG*587 + bgB*114)/1000 > 128;
  var textColor = text || (isLight ? '#111111' : '#FFFFFF');
  function hexAlpha(h, a) {
    if (!h) return 'rgba(128,128,128,'+a+')';
    var rr=parseInt(h.slice(1,3),16), gg=parseInt(h.slice(3,5),16), bb=parseInt(h.slice(5,7),16);
    return 'rgba('+rr+','+gg+','+bb+','+a+')';
  }
  root.style.setProperty('--white', textColor);
  root.style.setProperty('--t1', textColor);
  root.style.setProperty('--t2', hexAlpha(textColor, 0.7));
  root.style.setProperty('--t3', hexAlpha(textColor, 0.42));
  root.style.setProperty('--bw',  isLight ? 'rgba(0,0,0,.1)' : 'rgba(255,255,255,.07)');

  if (title) {
    var el = document.getElementById('pv-title');
    if (el) el.textContent = title;
    var ini = document.getElementById('pv-initial');
    if (ini) ini.textContent = title[0].toUpperCase();
  }
  if (sub) {
    var el2 = document.getElementById('pv-subtitle');
    if (el2) el2.textContent = sub;
  }
})();

(function() {
  function applyExtras(d) {
    if (!d || d.type !== 'firo-theme-preview') return;

    if (d.logo && /^data:image\//.test(d.logo)) {
      var ini = document.getElementById('pv-initial');
      if (ini) {
        ini.textContent = '';
        ini.style.backgroundImage = "url('" + d.logo.replace(/'/g, "%27") + "')";
        ini.style.backgroundColor = 'transparent';
      }
    }

    if (d.bg_image && /^data:image\//.test(d.bg_image)) {
      var card = document.getElementById('pv-card');
      if (card) {
        var ov = Math.max(0, Math.min(95, parseInt(d.bg_overlay || '70', 10))) / 100;
        card.style.backgroundImage =
          'linear-gradient(rgba(10,10,12,' + ov + '), rgba(10,10,12,' + Math.min(1, ov + 0.12) + ')), url("' + d.bg_image.replace(/"/g, '%22') + '")';
        card.style.backgroundSize = 'cover';
        card.style.backgroundPosition = 'center';
      }
    }

    if (d.qr_position === 'top') {
      var qr = document.getElementById('pv-qr-section');
      var parent = qr && qr.parentElement;
      if (qr && parent) {
        var header = parent.querySelector('[style*="border-bottom"]');
        parent.insertBefore(qr, parent.children[1] || null);
      }
    }

    if (d.cancel_position === 'top') {
      var cancel = document.getElementById('pv-cancel-btn');
      if (cancel) { cancel.style.order = '-1'; cancel.style.marginTop = '0'; cancel.style.marginBottom = '8px'; }
    }
  }

  window.addEventListener('message', function(e) { applyExtras(e.data); });
  try { if (window.opener) window.opener.postMessage('firo-preview-ready', '*'); } catch (_) {}
})();
</script>

  <script>
  (function () {
    var KEY = 'firo-theme';
    var mql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;

    function stored() {
      try { return localStorage.getItem(KEY) || 'dark'; } catch (e) { return 'dark'; }
    }
    function effective(mode) {
      if (mode === 'system') return (mql && mql.matches) ? 'light' : 'dark';
      return mode;
    }
    function paint(mode, animate) {
      var root = document.documentElement;
      if (animate) {
        root.classList.add('theme-anim');
        setTimeout(function () { root.classList.remove('theme-anim'); }, 400);
      }
      if (effective(mode) === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
      document.querySelectorAll('[data-theme-switch]').forEach(function (sw) {
        sw.querySelectorAll('[data-theme-opt]').forEach(function (b) {
          var on = b.getAttribute('data-theme-opt') === mode;
          b.setAttribute('aria-checked', on ? 'true' : 'false');
          b.style.background = on ? 'var(--bg0)' : 'transparent';
          b.style.color      = on ? 'var(--y)'   : 'var(--t3)';
          b.style.boxShadow  = on ? '0 1px 3px rgba(0,0,0,.18)' : 'none';
        });
      });
    }
    function setMode(mode) {
      try { localStorage.setItem(KEY, mode); } catch (e) {}
      paint(mode, true);
    }
    window.__setTheme = setMode;
    window.toggleTheme = function () { setMode(effective(stored()) === 'light' ? 'dark' : 'light'); };

    paint(stored(), false);
    if (mql) {
      var onOS = function () { if (stored() === 'system') paint('system', true); };
      if (mql.addEventListener) mql.addEventListener('change', onOS);
      else if (mql.addListener) mql.addListener(onOS);
    }

    var ICON = {
      light: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 15.3V14.7M2.8 13.2l.47-.47M.67 8h.66M2.8 2.8l.47.47M8 1.3V.67M12.7 3.3l.47-.47M14.7 8h.66M12.7 12.7l.47.47M12 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>',
      system:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13.76 10.24V5.63c0-1.07 0-1.61-.21-2.02a1.9 1.9 0 0 0-.84-.84c-.41-.21-.95-.21-2.02-.21H5.31c-1.07 0-1.61 0-2.02.21-.36.18-.65.48-.84.84-.21.41-.21.95-.21 2.02v4.61M13.76 10.24H2.24M13.76 10.24c.35 0 .64.29.64.64 0 1.06-.86 1.92-1.92 1.92H3.52c-1.06 0-1.92-.86-1.92-1.92 0-.35.29-.64.64-.64"/></svg>',
      dark:  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7.98A4.33 4.33 0 0 1 10.33 10 4.33 4.33 0 0 1 6 5.67 4.33 4.33 0 0 1 8.02 2 6 6 0 1 0 14 7.98Z"/></svg>'
    };
    function optBtn(mode, label) {
      return '<button type="button" role="radio" data-theme-opt="' + mode + '" title="' + label + '" aria-label="' + label + '" ' +
        'onclick="__setTheme(\'' + mode + '\')" ' +
        'style="flex:1;display:flex;align-items:center;justify-content:center;height:26px;border:none;border-radius:14px;' +
        'background:transparent;color:var(--t3);cursor:pointer;transition:background .2s,color .2s;">' + ICON[mode] + '</button>';
    }
    function switchHTML() {
      return '<div data-theme-switch role="radiogroup" aria-label="Theme" ' +
        'style="display:flex;align-items:center;gap:2px;height:32px;padding:3px;border-radius:18px;' +
        'background:var(--bg3);border:1px solid var(--bw);width:104px;">' +
        optBtn('light','Light') + optBtn('system','System') + optBtn('dark','Dark') +
        '</div>';
    }
    function mount() {
      document.querySelectorAll('[data-theme-toggle-mount]').forEach(function (el) {
        if (el.querySelector('[data-theme-switch]')) return;
        el.innerHTML = switchHTML();
      });
      paint(stored(), false);
    }
    window.__mountThemeSwitch = mount;
    if (document.readyState !== 'loading') mount();
    else document.addEventListener('DOMContentLoaded', mount);
    setTimeout(mount, 800);
  })();
  </script>
